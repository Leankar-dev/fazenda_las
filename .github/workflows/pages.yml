# Publica o FAZENDA LAS no GitHub Pages (https://leankar-dev.github.io/fazenda_las/).
# Requer, UMA vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Só vai para o ar o que o tools/build-site.js monta (sem docs/, tests/, tools/, .jpeg); antes disso rodam os testes rápidos (Node, sem navegador).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; um push novo cancela o que ainda não terminou
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes unitários (SaveManager e build do site)
        run: |
          for f in save.js game.js art.js animais.js pesca.js tools/build-site.js tools/service-worker.template.js; do node --check "$f"; done
          node tests/save.test.js
          node tests/pesca.test.js
          node tests/build.test.js
      - name: Montar o site
        run: node tools/build-site.js --out=_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
